# Exporter A. Scraped by Prometheus with labels: { cluster: vibhuvioio }
# `entries:` is GLOBAL to an exporter instance, not per target - which is the
# real reason to run one exporter per directory rather than one for everything.
listen: ":9330"
metrics_path: /metrics
scrape_timeout: 10s

defaults:
  bind_dn: cn=Manager,dc=vibhuvioio,dc=com
  password: ${VIBHUVIOIO_ADMIN_PASSWORD}
  # This image's config database bind DN is cn=config, not cn=admin,cn=config.
  config_bind_dn: cn=config
  config_password: ${VIBHUVIOIO_CONFIG_PASSWORD}

targets:
  - name: vibhuvioio-single
    uri: ldap://openldap-vibhuvioio:389
    group: vibhuvioio
    role: provider

suffixes:
  - dc=vibhuvioio,dc=com

entries:
  - name: all
    base: dc=vibhuvioio,dc=com
    filter: (objectClass=*)
  - name: people
    base: ou=People,dc=vibhuvioio,dc=com
    filter: (objectClass=inetOrgPerson)

# Three exporter instances, one per directory - the pattern the exporter's
# docs/PROMETHEUS.md prescribes for more than one estate. Prometheus attaches a
# `cluster` label to each (conf/prometheus/prometheus.yml), which is what the
# Grafana dashboard's $cluster variable reads.
#
# The directories themselves are NOT defined here: they come from
# openldap-usecases (vibhuvioio-com-singlenode, oiocloud-com-multinode,
# acme-com-twinnode), so their config is maintained in exactly one place.
networks:
  monitoring:
    external: true
  ldap-shared-network:
    external: true

services:
  openldap-exporter:
    image: vibhuvioio/openldap-exporter:latest
    container_name: openldap-exporter
    env_file:
      - .env.vibhuvioio
    volumes:
      - ./openldap-exporter.yml:/etc/openldap-exporter/openldap-exporter.yml:ro
    ports:
      - "9330:9330"
    restart: unless-stopped
    networks:
      - monitoring
      - ldap-shared-network

  openldap-exporter-alt:
    image: vibhuvioio/openldap-exporter:latest
    container_name: openldap-exporter-alt
    env_file:
      - .env.vibhuvioio
    volumes:
      - ./openldap-exporter-alt.yml:/etc/openldap-exporter/openldap-exporter.yml:ro
    ports:
      - "9331:9331"
    restart: unless-stopped
    networks:
      - monitoring
      - ldap-shared-network

  openldap-exporter-acme:
    image: vibhuvioio/openldap-exporter:latest
    container_name: openldap-exporter-acme
    env_file:
      - .env.vibhuvioio
    volumes:
      - ./openldap-exporter-acme.yml:/etc/openldap-exporter/openldap-exporter.yml:ro
    ports:
      - "9332:9332"
    restart: unless-stopped
    networks:
      - monitoring
      - ldap-shared-network
